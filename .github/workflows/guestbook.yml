name: Guestbook

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: guestbook
  cancel-in-progress: false

jobs:
  sign:
    if: contains(github.event.issue.title, 'Guestbook') && github.event.issue.user.type == 'User'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Add signature (login only) and rebuild README
        env:
          LOGIN: ${{ github.event.issue.user.login }}
        run: |
          python3 .github/scripts/guestbook.py
          python3 tools/build.py --readme-only
      - name: Commit
        env:
          LOGIN: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/guestbook.json README.md
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "guestbook: @${LOGIN} signed"
          git pull --rebase --autostash
          git push
      - name: Thank the visitor and close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "Thanks for signing my guestbook! ✨ Your avatar is now on my profile."
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
