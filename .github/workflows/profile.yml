name: Profile

on:
  push:
    branches: [main]
    paths: ["data/profile.json", "tools/**"]
  schedule:
    - cron: "23 4 * * *" # every day at 04:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readme:
    name: Rebuild README + pixel assets
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build from data/profile.json
        run: python3 tools/build.py
      - name: Commit if something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "chore(profile): rebuild README and assets"
          git pull --rebase --autostash
          git push

  activity:
    name: Snake + stats card → output branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Stats card (light + dark)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}
        run: python3 .github/scripts/stats_card.py --out dist
      - name: Snake (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#D36823&color_dots=#E7F3D4,#B6DD7A,#88C92C,#4F8F16,#2E5D16
            dist/snake-dark.svg?palette=github-dark&color_snake=#F0A35E&color_dots=#161B22,#1F4A12,#2C6E14,#4F8F16,#88C92C
      - name: Publish to the output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "chore(profile): refresh activity assets"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
